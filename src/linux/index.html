<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLO Syntax Lab Linux</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><h1>♠ PLO Syntax Lab <small>Linux</small></h1><p>ボードから条件を生成し、CSVのweightを比較します。処理・履歴はこのPC内で完結します。</p></header>
<main><section><h2>1. ボードと比較条件</h2><form id="board-form"><label>ボード（3〜5枚）<input id="board" value="Js Td 7c" required></label><button id="generate">デフォルト185条件を生成</button></form><p id="progress" role="status"></p><div class="actions"><button id="open-lab">syntax生成を開く</button><label class="file-button">条件JSONを読み込む<input type="file" id="selection-file" accept=".json"></label></div><div class="actions"><label><input type="radio" name="mode" value="defaults" checked>デフォルト</label><label><input type="radio" name="mode" value="custom">syntax生成</label><label><input id="all" type="checkbox" checked>全ハンド（syntaxなし）を集計</label></div><input id="condition-search" type="search" placeholder="条件を検索" aria-label="条件を検索"><div id="conditions"></div></section>
<section><h2>2. CSVを選ぶ</h2><p>hand / combo列と0〜1のweight列を持つUTF-8 CSVを2〜3つ選択。入力合計は32MiBまで。</p><div id="files"></div><div class="actions"><button id="compare">比較して履歴に保存</button><button id="cancel" disabled>中止</button><button id="download" disabled>結果CSVを保存</button></div><p id="error" role="alert"></p><div id="results"></div></section>
<section><h2>履歴</h2><input id="history-search" type="search" placeholder="ボード・CSV名を検索" aria-label="履歴を検索"><button id="refresh-history">更新</button><div id="history"></div></section></main><footer>MonkerSolver実機での構文受理・抽出一致は未検証です。終了するには起動した端末でCtrl+C。</footer></body></html>
